name: ci

# 门禁 1/3：行为正确性。任何 push 到 main 与任何 PR 都必须全绿。
# - test:   单元 + 注入式回归（Node 22 / 24 双版本）
# - eval:   I1–I15 注入式评测（行为契约，不看覆盖率）
# - coverage: 覆盖率下限（lines≥85 / branches≥70 / functions≥90，改阈值需 ADR）
# - windows-smoke: Windows 回归冒烟（issue #62；只钉冒烟，不替代全量测试）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: 单元测试 + 注入式回归
        working-directory: versions/v0.3
        run: node --test 'tests/**/*.test.js'
      - name: 覆盖率门禁
        if: matrix.node == '22'
        run: node tools/coverage-gate.mjs

  # Windows 回归防线（issue #62 第 1 步）：全量测试仍只跑 ubuntu（13 条 POSIX 假设
  # 用例在 Windows 红，另建 issue）；这里只钉「写得进、看得见、压得动、跑得成」。
  windows-smoke:
    name: windows-smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Windows 冒烟（真相层文件名 / 分库枚举 / compact / nightly）
        run: node tools/windows-smoke.mjs

  eval:
    name: eval (I1–I50)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 跑评测套件
        working-directory: versions/v0.3
        run: node eval/run.js
      - name: 归档评测结果
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: versions/v0.3/eval/results/LATEST.json
          if-no-files-found: warn

  plugin:
    name: plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: dsh-sedimem host tests
        run: node --test --test-force-exit plugin/dsh-sedimem/test/host.test.js
      - name: client bundle syntax
        run: node --check plugin/dsh-sedimem/lib/client.js

  gate:
    name: ci-gate
    needs: [test, eval, plugin]
    runs-on: ubuntu-latest
    steps:
      - run: echo "行为门禁全部通过"
