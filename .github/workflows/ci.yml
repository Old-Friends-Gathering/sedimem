name: ci

# 门禁 1/3：行为正确性。任何 push 到 main 与任何 PR 都必须全绿。
# - test:   单元 + 注入式回归（Node 22 / 24 双版本）
# - eval:   I1–I12 注入式评测（行为契约，不看覆盖率）
# - coverage: 覆盖率下限（lines≥85 / branches≥70 / functions≥90，改阈值需 ADR）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 单元测试 + 注入式回归
        working-directory: versions/v0.1
        run: node --test 'tests/**/*.test.js'
      - name: 覆盖率门禁
        if: matrix.node == '22'
        run: node tools/coverage-gate.mjs

  eval:
    name: eval (I1–I12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 跑评测套件
        working-directory: versions/v0.1
        run: node eval/run.js
      - name: 归档评测结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: versions/v0.1/eval/results/LATEST.json
          if-no-files-found: warn

  gate:
    name: ci-gate
    needs: [test, eval]
    runs-on: ubuntu-latest
    steps:
      - run: echo "行为门禁全部通过"
