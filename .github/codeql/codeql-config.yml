# CodeQL 扫描范围
#
# `versions/v0.1/` 是冻结的历史快照（0.1.2，见其 FROZEN.md）：只读、不随 CI 跑、不再演进。
# 对它做安全扫描没有收益（修了也不发版），却会把当年已修过的问题重新报成新告警，
# 噪声盖住真正需要关注的当前版本。所以扫描范围收敛到当前版本（versions/CURRENT = v0.2）。
name: sedimem
paths-ignore:
  # 冻结的历史版本目录（v0.x）：只读快照、不随 CI 跑、不再发版。
  # 它们的问题修了也不会发布，却会持续占用告警面板并把当前版本的真实问题淹掉。
  # 新增大版本时（v1.0 之后），把上一个已冻结的目录加到下面。
  - versions/v0.*/**
  - versions/v0.1/**
  # 审核留证脚本（reviews/probes/）是一次性证据，不随版本发布、不进运行时：
  # 它们的未用变量/风格问题没有修复价值，却会淹掉当前代码的真实告警。
  - versions/*/reviews/probes/**
  # 插件里的两份文件是 scripts/sync-plugin.sh 从 versions/<CURRENT>/src 复制的**生成物**
  # （inject.js / paths.js 已按源码扫描）：扫副本只会把同一处代码重复报一遍。
  - plugin/dsh-sedimem/lib/inject-core.js
  - plugin/dsh-sedimem/lib/paths-core.js

# 已知误报：embedding 端点 URL 来自用户自己的 policy 文件（本机配置，可信来源），
# 且 createEmbedder() 里用 validatedEndpoint() 只放行 http(s)+host。
# CodeQL 的 js/file-access-to-http 仍按「文件内容进入网络请求」报出，故定向排除，
# 排除范围仅限这一个文件，不影响其它 HTTP 数据流检查。
query-filters:
  - exclude:
      id: js/file-access-to-http
      paths:
        - versions/**/src/index/embedder.js
